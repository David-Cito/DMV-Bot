name: Road Test Bot

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification even if no appointments found"
        required: false
        default: "false"
      notification_type:
        description: "Notification type to send (after scan)"
        required: false
        default: "instant"
        type: choice
        options:
          - instant
          - daily
          - weekly
          - none
      scan_days:
        description: "Number of days to scan ahead"
        required: false
        default: "45"

jobs:
  monitor:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    permissions:
      contents: read
    concurrency:
      group: road-test-bot
      cancel-in-progress: false
    env:
      CI: "true"
      ROAD_TEST_HEADLESS: "true"
      ROAD_TEST_NOTIFY_TEST: ${{ inputs.test_notify || 'false' }}

    steps:
      - name: Night jitter (HST)
        run: |
          hour=$(TZ=Pacific/Honolulu date +%H)
          if [ "$hour" -ge 0 ] && [ "$hour" -lt 6 ]; then
            delay=$((RANDOM % 121))
            echo "Night hours (HST). Sleeping ${delay}s for jitter."
            sleep "$delay"
          else
            echo "Daytime hours (HST). No jitter."
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Road Test monitoring bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node apps/road-test-bot/run-road-test-bot.ts --monitor --headless --upload --days=${{ inputs.scan_days || '45' }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-test-screenshots-${{ github.run_id }}
          path: data/screenshots/
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-test-results-${{ github.run_id }}
          path: data/results/road-test-results.json
          retention-days: 30

      - name: Send notifications
        if: always() && inputs.notification_type != 'none'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          ROAD_TEST_NOTIFY_TEST: ${{ inputs.test_notify || 'false' }}
        run: node scripts/notifications/send-road-test-notifications.js --type=${{ inputs.notification_type || 'instant' }}
