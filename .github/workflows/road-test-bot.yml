name: Road Test Bot

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification even if no appointments found"
        required: false
        default: "false"
      scan_days:
        description: "Number of days to scan ahead"
        required: false
        default: "45"
      verbose:
        description: "Enable verbose diagnostic logging"
        required: false
        default: "false"

  # External trigger from cron-job.org (shows as "road-test-cron" in UI)
  repository_dispatch:
    types: [road-test-cron]

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    permissions:
      contents: read
    concurrency:
      group: road-test-bot
      cancel-in-progress: false
    env:
      CI: "true"
      ROAD_TEST_HEADLESS: "true"
      # Support both workflow_dispatch (inputs) and repository_dispatch (client_payload)
      ROAD_TEST_NOTIFY_TEST: ${{ inputs.test_notify || github.event.client_payload.test_notify || 'false' }}
      ROAD_TEST_VERBOSE: ${{ inputs.verbose || github.event.client_payload.verbose || 'false' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Road Test monitoring bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node apps/road-test-bot/run-road-test-bot.ts --monitor --headless --upload --days=${{ inputs.scan_days || github.event.client_payload.scan_days || '45' }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-test-screenshots-${{ github.run_id }}
          path: data/screenshots/
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: road-test-results-${{ github.run_id }}
          path: data/results/road-test-results.json
          retention-days: 30

      - name: Send instant notifications
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          ROAD_TEST_NOTIFY_TEST: ${{ inputs.test_notify || github.event.client_payload.test_notify || 'false' }}
        run: node scripts/notifications/send-road-test-notifications.js --type=instant
