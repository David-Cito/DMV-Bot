name: DMV Health Check

on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase/run-health-check.js

      - name: Display summary
        run: |
          echo "=== Health Check Summary ==="
          jq -r '.run_at as $run | "Run at: \($run)"' data/results/supabase-health-check.json
          jq -r '"Schema source: \(.report.schema.source)"' data/results/supabase-health-check.json
          echo ""
          echo "=== Tables ($(jq '.report.tables | length' data/results/supabase-health-check.json)) ==="
          jq -r '.report.counts[] | "\(.table_name): \(.row_count // "N/A") rows"' data/results/supabase-health-check.json
          echo ""
          echo "=== Views ($(jq '.report.views | length' data/results/supabase-health-check.json)) ==="
          jq -r '.report.views[] | "\(.name): \(if .ok then "OK" else "ERROR" end)"' data/results/supabase-health-check.json
          echo ""
          echo "=== Functions ($(jq '.report.functions | length' data/results/supabase-health-check.json)) ==="
          jq -r '.report.functions[:15][] | "\(.function_name // .routine_name)(\(.argument_types // "")) -> \(.return_type // .data_type)"' data/results/supabase-health-check.json
          echo ""
          echo "=== Indexes ($(jq '.report.indexes | length' data/results/supabase-health-check.json)) ==="
          jq -r '.report.indexes[:10][] | "\(.table_name).\(.index_name)"' data/results/supabase-health-check.json 2>/dev/null || echo "N/A"
          echo ""
          echo "=== Constraints ($(jq '.report.constraints | length' data/results/supabase-health-check.json)) ==="
          jq -r '.report.constraints[:10][] | "\(.table_name): \(.constraint_name) (\(.constraint_type))"' data/results/supabase-health-check.json 2>/dev/null || echo "N/A"

      - name: Upload health check results
        uses: actions/upload-artifact@v4
        with:
          name: health-check-results
          path: data/results/supabase-health-check.json

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results/supabase-health-check.json
          git diff --staged --quiet || git commit -m "Update health check results [skip ci]"
          git push
